name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@1e96bd0df4241d3b5981cc508d74543db54c6c29
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@1e96bd0df4241d3b5981cc508d74543db54c6c29

  nix-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          prepare-dev-shell: false
      - name: Build and smoke-test the Nix package
        run: |
          nix build .#c-plugin
          nix run . -- --help
          nix run . -- --version
