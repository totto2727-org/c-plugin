name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The Iris-compatible GHC 9.4 dependency closure can require source builds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - name: Run standard validation
        run: nix develop --command just ci
