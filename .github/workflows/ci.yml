name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@97acf73cf618834a65fb1b82e09185a32e59caf9
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@97acf73cf618834a65fb1b82e09185a32e59caf9
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@97acf73cf618834a65fb1b82e09185a32e59caf9

  nix-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@97acf73cf618834a65fb1b82e09185a32e59caf9
        with:
          prepare-dev-shell: false
      - name: Build and smoke-test the Nix package
        run: |
          nix build .#c-plugin
          nix run . -- --help
          nix run . -- --version
