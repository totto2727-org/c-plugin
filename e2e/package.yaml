name: c-plugin-e2e
version: 0.1.0
synopsis: Docker acceptance tests for c-plugin
description: Exercise the c-plugin CLI in isolated Docker containers through Caseyard and Hspec.
category: Testing
author: totto2727
maintainer: totto2727
license: MIT
extra-source-files: CPlugin/E2E/*.md

tests:
  acceptance:
    main: Spec.hs
    source-dirs: .
    ghc-options: -Wall -threaded -rtsopts
    dependencies:
      - base >=4.18 && <5
      - aeson >=2.1 && <2.3
      - bytestring >=0.11 && <0.13
      - caseyard >=0.1.0.0 && <0.2
      - containers >=0.6 && <0.9
      - cryptohash-sha256 >=0.11 && <0.12
      - filepath >=1.4 && <1.6
      - hspec >=2.11 && <2.12
      - text >=2.0 && <2.2
      - vector >=0.13 && <0.14
