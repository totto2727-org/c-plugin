name: c-plugin
version: 0.1.0
synopsis: Ownership-safe plugin skill manager
description: Install Agent Plugins 1.0 and standalone skills from local directories or pinned GitHub sources, and safely reconcile owned symlinks.
category: Tools
author: totto2727
maintainer: totto2727
license: MIT
github: totto2727-org/c-plugin
extra-source-files: cbits/*.h

language: Haskell2010
ghc-options: -Wall
dependencies:
  - base >=4.17 && <4.18
  - aeson >=2.1 && <2.3
  - aeson-pretty >=0.8 && <0.9
  - bytestring >=0.11 && <0.13
  - containers >=0.6 && <0.8
  - directory >=1.3 && <1.4
  - filepath >=1.4 && <1.6
  - text >=2.0 && <2.1
  - unix >=2.7 && <2.9
  - yaml >=0.11 && <0.12

library:
  source-dirs: lib
  c-sources: cbits/libgit2.c
  include-dirs: cbits
  cc-options: -std=c11
  pkg-config-dependencies: libgit2 >=1.9 && <1.10
  dependencies:
    - process >=1.6 && <1.7
    - async >=2.2 && <2.3
    - brick >=2.9 && <2.10
    - vty >=6.4 && <6.5
    - vty-unix >=0.2 && <0.3
    - mtl >=2.2 && <2.4

executables:
  c-plugin:
    main: Main.hs
    source-dirs: app
    ghc-options: -threaded -rtsopts
    dependencies:
      - c-plugin
      - iris >=0.1 && <0.2
      - optparse-applicative >=0.17 && <0.18
      - transformers >=0.5 && <0.7

tests:
  product-tests:
    main: Spec.hs
    source-dirs: test
    ghc-options: -threaded -rtsopts
    dependencies:
      - c-plugin
      - hspec >=2.11 && <2.12
      - temporary >=1.3 && <1.4
      - async >=2.2 && <2.3
